name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Checkout workflow-ui
        uses: actions/checkout@v4
        with:
          repository: GoCodeAlone/workflow-ui
          path: workflow-ui-dep

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'

      - name: Build workflow-ui
        run: |
          cd workflow-ui-dep
          npm ci
          npm run build

      - name: Link workflow-ui
        run: ln -s "$GITHUB_WORKSPACE/workflow-ui-dep" "$GITHUB_WORKSPACE/../workflow-ui"

      - name: Build UI
        run: cd ui && npm ci && npm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

          go build -ldflags "-X github.com/GoCodeAlone/ratchet/internal/version.Version=${VERSION}" \
            -o "bin/ratchetd-${GOOS}-${GOARCH}${EXT}" ./cmd/ratchetd

          go build -ldflags "-X github.com/GoCodeAlone/ratchet/internal/version.Version=${VERSION}" \
            -o "bin/ratchet-${GOOS}-${GOARCH}${EXT}" ./cmd/ratchet

      - name: Package
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          GOOS="${{ matrix.goos }}"
          GOARCH="${{ matrix.goarch }}"
          ARCHIVE="ratchet-${VERSION}-${GOOS}-${GOARCH}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          mkdir -p "dist/${ARCHIVE}"
          cp "bin/ratchetd-${GOOS}-${GOARCH}${EXT}" "dist/${ARCHIVE}/ratchetd${EXT}"
          cp "bin/ratchet-${GOOS}-${GOARCH}${EXT}" "dist/${ARCHIVE}/ratchet${EXT}"
          cp -r ui/dist "dist/${ARCHIVE}/ui-dist"
          cp ratchet.yaml "dist/${ARCHIVE}/"
          cp README.md "dist/${ARCHIVE}/"
          cd dist && tar czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

  ui-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout workflow-ui
        uses: actions/checkout@v4
        with:
          repository: GoCodeAlone/workflow-ui
          path: workflow-ui-dep
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
      - name: Build workflow-ui
        run: |
          cd workflow-ui-dep
          npm ci
          npm run build
      - name: Link workflow-ui
        run: ln -s "$GITHUB_WORKSPACE/workflow-ui-dep" "$GITHUB_WORKSPACE/../workflow-ui"
      - run: cd ui && npm ci && npm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload UI dist
        uses: softprops/action-gh-release@v2
        with:
          files: ui/dist/**

  notify-workflow-registry:
    name: Notify workflow-registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release
    if: >-
      !github.event.deleted
      && !contains(github.ref_name, '-')
      && github.repository == 'GoCodeAlone/ratchet'
    steps:
      - name: Trigger registry manifest sync
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4
        with:
          token: ${{ secrets.repo_dispatch_token }}
          repository: GoCodeAlone/workflow-registry
          event-type: plugin-release
          client-payload: |-
            {"plugin": "ratchet", "tag": "${{ github.ref_name }}"}
